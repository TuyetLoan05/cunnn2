
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffe5ef">
  <title>Dành cho Mẹ iuuu 💗</title>

  <style>
    :root {
      --pink: #ffe5ef;
      --pink-light: #fff0f6;
      --pink-deep: #e987ad;
      --rose: #b34c7d;
      --rose-dark: #a54c70;
      --text: #75445a;
      --cream: #fffaf7;
      --border: #f2ccda;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      padding: 18px 12px;

      font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
      color: var(--text);

      background:
        radial-gradient(circle at 20% 15%, #fff9fc 0, transparent 32%),
        radial-gradient(circle at 85% 80%, #ffd1e2 0, transparent 35%),
        linear-gradient(135deg, #fff0f6, #ffe0eb 55%, #fff2f6);

      display: grid;
      place-items: center;
    }

    button {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    .glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;

      background: linear-gradient(
        120deg,
        transparent 30%,
        #ffffff38 48%,
        transparent 65%
      );

      animation: shimmer 9s ease-in-out infinite;
    }

    @keyframes shimmer {
      0%, 100% { transform: translateX(-25%); }
      50% { transform: translateX(25%); }
    }

    /* THIỆP CHÍNH */

    .card {
      width: min(100%, 680px);
      position: relative;
      z-index: 2;

      padding: clamp(28px, 6vw, 48px)
               clamp(18px, 5vw, 48px);

      border: 1px solid #ffffffd9;
      border-radius: 30px;

      background: #fffaf7e8;
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);

      box-shadow:
        0 24px 70px #bd527b22,
        inset 0 0 0 5px #fff7fa;

      text-align: center;
      animation: appear 1s ease both;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(18px) scale(.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .eyebrow {
      color: #bb6688;
      font-size: clamp(.68rem, 2.7vw, .8rem);
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .bouquet {
      display: inline-block;
      margin: 20px 0 8px;
      font-size: clamp(3.6rem, 14vw, 5.6rem);

      filter: drop-shadow(0 8px 8px #c86d8d25);
      transform-origin: 50% 90%;
      animation: sway 3.4s ease-in-out infinite;
    }

    @keyframes sway {
      0%, 100% { transform: rotate(-5deg) translateY(0); }
      50% { transform: rotate(5deg) translateY(-7px); }
    }

    h1 {
      margin: 12px 0;
      color: var(--rose);
      font-family: Georgia, serif;
      font-size: clamp(2.5rem, 9vw, 4.1rem);
      line-height: 1.06;
      overflow-wrap: break-word;
    }

    .date-label {
      display: inline-block;
      margin: 8px auto 0;
      padding: 8px 19px;
      border-radius: 99px;

      background: #ffe4ee;
      color: var(--rose-dark);
      font-size: 1rem;
      font-weight: 700;
    }

    /* ĐỒNG HỒ */

    .clock-card {
      position: relative;
      width: min(100%, 440px);
      margin: 34px auto 28px;
      padding: 26px 16px 23px;
      overflow: hidden;

      background: rgba(255, 250, 249, .92);
      border: 1.5px solid var(--border);
      border-radius: 27px;

      box-shadow:
        0 10px 30px rgba(181, 75, 125, .08),
        inset 0 0 0 5px rgba(255, 235, 241, .55);

      text-align: center;
    }

    .clock-card::before,
    .clock-card::after {
      content: "♡";
      position: absolute;
      color: #e7a1bc;
      font-size: 22px;
      opacity: .65;
      pointer-events: none;
    }

    .clock-card::before {
      top: 12px;
      left: 15px;
    }

    .clock-card::after {
      right: 15px;
      bottom: 10px;
    }

    .clock-title {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 9px;

      margin-bottom: 22px;
      color: var(--rose);
      font-size: clamp(16px, 4vw, 21px);
      font-weight: 700;
    }

    .clock-title .heart {
      font-size: 21px;
    }

    .clock-date {
      margin-bottom: 11px;
      color: #dc91b0;
      font-size: 18px;
      letter-spacing: 1px;
    }

    .clock-time {
      color: var(--rose);
      font-size: clamp(29px, 8vw, 43px);
      font-weight: 800;
      letter-spacing: clamp(1px, .6vw, 3px);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;

      text-shadow: 0 3px 12px rgba(179, 76, 125, .10);
    }

    .clock-footer {
      margin-top: 20px;
      color: #ad718c;
      font-size: clamp(11px, 3vw, 13px);
      line-height: 1.6;
    }

    .clock-footer span {
      padding: 0 4px;
      color: #d779a1;
    }

    /* LỜI NHẮN VÀ NÚT */

    .message {
      margin: 0 auto;
      font-size: clamp(1rem, 3.6vw, 1.15rem);
      line-height: 1.8;
    }

    .main-button,
    .close-button {
      border: 0;
      border-radius: 999px;
      padding: 14px 27px;

      background: linear-gradient(135deg, #e987ad, #ce6792);
      color: white;
      font-size: 1rem;
      font-weight: 700;

      box-shadow: 0 8px 20px #c45b852b;
      cursor: pointer;
      transition: transform .2s, box-shadow .2s;
    }

    .main-button {
      margin-top: 25px;
    }


    .main-button:hover,
    .close-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 11px 25px #c45b8540;
    }

    .main-button:active,
    .close-button:active {
      transform: scale(.97);
    }

    .hint {
      margin: 14px 0 0;
      color: #b17b91;
      font-size: .8rem;
    }

    /* HOA RƠI */

    .petal {
      position: fixed;
      z-index: 1;
      top: -12vh;
      pointer-events: none;
      opacity: .8;
      animation: fall linear forwards;
      filter: drop-shadow(0 2px 2px #b34c7620);
      will-change: transform;
    }

    @keyframes fall {
      0% {
        transform: translate3d(0, -5vh, 0) rotate(0deg);
        opacity: 0;
      }
      10% { opacity: .8; }
      100% {
        transform: translate3d(var(--drift), 115vh, 0)
                   rotate(var(--spin));
        opacity: 0;
      }
    }

    /* CỬA SỔ BÍ MẬT */

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 20;

      display: grid;
      place-items: center;
      padding: 20px;

      background: rgba(117, 68, 90, .45);
      -webkit-backdrop-filter: blur(7px);
      backdrop-filter: blur(7px);

      opacity: 0;
      animation: overlayIn .3s ease forwards;
    }

    @keyframes overlayIn {
      to { opacity: 1; }
    }

    .surprise-card {
      position: relative;
      width: min(100%, 410px);
      max-height: 90dvh;
      overflow-y: auto;

      padding: 27px 22px 25px;
      border: 1px solid white;
      border-radius: 27px;

      background: var(--cream);
      box-shadow: 0 20px 60px #6b304633;
      text-align: center;

      animation: surpriseIn .45s cubic-bezier(.2, .8, .2, 1) both;
    }

    @keyframes surpriseIn {
      from {
        opacity: 0;
        transform: translateY(18px) scale(.88);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .surprise-title {
      margin: 0 0 18px;
      color: var(--rose);
      font-family: Georgia, serif;
      font-size: 1.8rem;
      line-height: 1.3;
    }

    .surprise-photo {
      display: block;
      width: min(100%, 290px);
      max-height: 42dvh;
      object-fit: cover;
      margin: 0 auto 18px;

      border: 4px solid white;
      border-radius: 18px;
      box-shadow: 0 8px 24px #bd527b25;
    }

    .surprise-message {
      margin: 0 auto;
      color: var(--text);
      font-size: 1rem;
      line-height: 1.8;
      white-space: pre-line;
      overflow-wrap: anywhere;
      text-align: justify;
    }

    .surprise-message strong {
      color: var(--rose);
    }

    .close-button {
      margin-top: 21px;
      padding: 12px 23px;
    }

    .close-x {
      position: absolute;
      top: 10px;
      right: 13px;
      width: 35px;
      height: 35px;
      padding: 0;

      border: 0;
      border-radius: 50%;
      background: #ffe4ee;
      color: var(--rose);
      font-size: 23px;
      cursor: pointer;
    }

    @media (max-width: 400px) {
      body {
        padding: 10px 8px;
      }

      .card {
        padding: 28px 15px;
        border-radius: 24px;
      }

      .clock-card {
        padding: 24px 10px 21px;
        margin: 27px auto 24px;
      }

      .clock-title {
        gap: 6px;
        margin-bottom: 18px;
      }

      .clock-time {
        letter-spacing: 1px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <div class="glow" aria-hidden="true"></div>

  <main class="card">
    <div class="eyebrow">MỘT CHÚT YÊU THƯƠNG GỬI MẸ</div>

    <div class="bouquet" aria-hidden="true">💐</div>

    <h1>Happy<br>Women's Day<br>20/10</h1>

    <div class="date-label">Gửi mẹ yêu của con 💕</div>

    <!-- ĐỒNG HỒ REALTIME -->
    <section class="clock-card" aria-label="Đồng hồ hiện tại">
      <div class="clock-title">
        <span class="heart" aria-hidden="true"></span>
        <span>Thời gian bên mẹ 💗</span>
      </div>

      <div id="date" class="clock-date">20/10/2026</div>
      <div id="time" class="clock-time">00:00:00</div>

      <div class="clock-footer">
        <span>♡</span>
        Mỗi khoảnh khắc bên mẹ đều thật quý giá
        <span>♡</span>
      </div>
    </section>

    <p class="message">Con có một điều muốn nói với mẹ…</p>

    <button id="surpriseBtn" class="main-button" type="button">
      Mẹ mở nhé 💮
    </button>

    <audio id="bgMusic" loop preload="auto">
      <source src="nhac-nen.mp3" type="audio/mpeg">
      Trình duyệt của bạn không hỗ trợ phát nhạc.
    </audio>

    <p class="hint">Made with love by Con gái iuuu ♡</p>
  </main>

  <script>
    // =====================================
    // 1. ĐỒNG HỒ THEO GIỜ VIỆT NAM
    // =====================================

    const dateElement = document.getElementById("date");
    const timeElement = document.getElementById("time");

    const dateFormatter = new Intl.DateTimeFormat("vi-VN", {
      timeZone: "Asia/Ho_Chi_Minh",
      day: "2-digit",
      month: "2-digit",
      year: "numeric"
    });

    const timeFormatter = new Intl.DateTimeFormat("en-GB", {
      timeZone: "Asia/Ho_Chi_Minh",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      hour12: false
    });

    function updateClock() {
      const now = new Date();

      dateElement.textContent = dateFormatter.format(now);
      timeElement.textContent = timeFormatter.format(now);
    }

    updateClock();
    setInterval(updateClock, 1000);


    // =====================================
    // 2. HOA RƠI
    // =====================================

    const flowers = ["🌸", "🌷", "🌺", "💮", "💕", "✿"];

    const reduceMotion = window.matchMedia(
      "(prefers-reduced-motion: reduce)"
    ).matches;

    function makePetal() {
      if (reduceMotion) return;

      const el = document.createElement("span");

      el.className = "petal";
      el.setAttribute("aria-hidden", "true");

      el.textContent =
        flowers[Math.floor(Math.random() * flowers.length)];

      el.style.left = Math.random() * 100 + "vw";
      el.style.fontSize = (14 + Math.random() * 15) + "px";

      el.style.setProperty(
        "--drift",
        (Math.random() * 160 - 80) + "px"
      );

      el.style.setProperty(
        "--spin",
        (Math.random() * 700 - 350) + "deg"
      );

      const duration = 8 + Math.random() * 6;

      el.style.animationDuration = duration + "s";

      document.body.appendChild(el);

      setTimeout(() => el.remove(), duration * 1000 + 500);
    }

    if (!reduceMotion) {
      for (let i = 0; i < 10; i++) {
        setTimeout(makePetal, i * 350);
      }

      setInterval(makePetal, 900);
    }


    // =====================================
    // 3. NỘI DUNG THIỆP BÍ MẬT
    // =====================================

    const messages = `
    Ngày 20/10, con chúc mẹ luôn mạnh khỏe, vui vẻ, bình an và lúc nào cũng nở nụ cười thật tươi. Mong rằng những ngày tháng sau này của mẹ sẽ có thật nhiều niềm vui, ít muộn phiền và luôn được yêu thương thật nhiều.
    Mẹ ơi, con cũng muốn xin lỗi mẹ vì chuyện lúc nãy. Con xin lỗi vì đã để mẹ tổn thương bởi chính những lời nói và thái độ của con.
    Chúc mẹ yêu của con một ngày 20/10 thật hạnh phúc. Con xin lỗi mẹ, và con yêu mẹ rất nhiều!
    `.trim();

    const surpriseBtn = document.getElementById("surpriseBtn");
    const bgMusic = document.getElementById("bgMusic");

    async function playMusic() {
      try {
        await bgMusic.play();
      } catch (error) {
        // Một số trình duyệt chặn tự phát nhạc cho đến khi người dùng chạm trang.
      }
    }

    function closeSurprise(overlay) {
      overlay.remove();
      surpriseBtn.focus();
    }

    function showSurprise() {
      const overlay = document.createElement("div");

      overlay.className = "overlay";
      overlay.setAttribute("role", "dialog");
      overlay.setAttribute("aria-modal", "true");
      overlay.setAttribute("aria-label", "Lá thư nhỏ dành cho mẹ");

      const card = document.createElement("div");
      card.className = "surprise-card";

      const closeX = document.createElement("button");
      closeX.className = "close-x";
      closeX.type = "button";
      closeX.textContent = "×";
      closeX.setAttribute("aria-label", "Đóng thiệp");

      const title = document.createElement("h2");
      title.className = "surprise-title";
      title.textContent = "Lá thư nhỏ dành cho mẹ 💕";

      const photo = document.createElement("img");
      photo.className = "surprise-photo";
      photo.src = "your-photo.jpg";
      photo.alt = "A special photo for you";

      photo.addEventListener("error", () => {
        photo.alt = "Chưa tìm thấy ảnh. Hãy kiểm tra tên file ảnh.";
        photo.style.display = "none";
      });

      const message = document.createElement("p");
      message.className = "surprise-message";
      message.textContent = messages;

      const closeBtn = document.createElement("button");
      closeBtn.className = "close-button";
      closeBtn.type = "button";
      closeBtn.textContent = "Cảm ơn mẹ yêu đã đọc 💗";

      closeX.addEventListener("click", () => closeSurprise(overlay));
      closeBtn.addEventListener("click", () => closeSurprise(overlay));

      overlay.addEventListener("click", (event) => {
        if (event.target === overlay) {
          closeSurprise(overlay);
        }
      });

      card.append(closeX, title, photo, message, closeBtn);
      overlay.appendChild(card);
      document.body.appendChild(overlay);

      closeX.focus();
    }

    surpriseBtn.addEventListener("click", () => {
      // Trình duyệt thường cho phép phát nhạc sau thao tác chạm của người dùng.
      playMusic();
      showSurprise();
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        const overlay = document.querySelector(".overlay");

        if (overlay) {
          closeSurprise(overlay);
        }
      }
    });
  </script>
</body>
</html>
